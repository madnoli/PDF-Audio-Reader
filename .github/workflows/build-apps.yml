name: Build apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --org com.madnoli --project-name audio_reader .
      - run: python3 ../.github/scripts/patch_platforms.py android
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK
        shell: bash
        run: flutter build apk --release 2>&1 | tee ../build.log; exit ${PIPESTATUS[0]}
      - name: Show build errors
        if: failure()
        shell: bash
        # Turns the key lines of the build log into an annotation, readable without signing in.
        run: |
          msg=$(grep -iE "error|exception|failed|what went wrong|cannot|unresolved" -A4 ../build.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build log::$msg"
      - run: cp build/app/outputs/flutter-apk/app-release.apk ../AudioReader-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AudioReader-android
          path: AudioReader-android.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows project
        run: flutter create --platforms=windows --org com.madnoli --project-name audio_reader .
      - run: python ../.github/scripts/patch_platforms.py windows
      - run: flutter pub get
      - name: Build Windows app
        shell: bash
        run: flutter build windows --release 2>&1 | tee ../build.log; exit ${PIPESTATUS[0]}
      - name: Show build errors
        if: failure()
        shell: bash
        # Turns the key lines of the build log into an annotation, readable without signing in.
        run: |
          msg=$(grep -iE "error|exception|failed|what went wrong|cannot|unresolved" -A4 ../build.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build log::$msg"
      - name: Zip the app folder
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ../AudioReader-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AudioReader-windows
          path: AudioReader-windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            AudioReader-android.apk
            AudioReader-windows.zip
