name: Build apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --org com.madnoli --project-name audio_reader .
      - run: python3 ../.github/scripts/patch_platforms.py android
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk ../AudioReader-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AudioReader-android
          path: AudioReader-android.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows project
        run: flutter create --platforms=windows --org com.madnoli --project-name audio_reader .
      - run: python ../.github/scripts/patch_platforms.py windows
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip the app folder
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ../AudioReader-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AudioReader-windows
          path: AudioReader-windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            AudioReader-android.apk
            AudioReader-windows.zip
