name: audio_reader
description: Reads PDF and EPUB books aloud with Indian voices.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.0
  audio_service: ^0.18.19
  file_picker: ^13.1.0
  flutter_tts: ^4.2.5
  html: ^0.15.7
  scrollable_positioned_list: ^0.3.8
  shared_preferences: ^2.5.5
  syncfusion_flutter_pdf: ^35.1.37
  xml: ^7.1.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
